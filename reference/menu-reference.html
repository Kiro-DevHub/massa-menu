<title>Меню на массу</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Golos+Text:wght@400;500;600;700&family=Caveat:wght@600;700&display=swap">
<style>
/* Layout: one-column phone app — sticky day header, scrolling cards, fixed bottom tab bar. Macro triad: protein blue, fat rose, carbs saffron (carbs are the accent). Fridge items are masking-tape labels. */
:root{
  --bg:#F2F3EF; --surface:#FFFFFF; --surface2:#E8EAE4; --ink:#151915; --muted:#5D655E; --line:#D6DAD2;
  --accent:#D99A00; --accent-ink:#7A5400; --on-accent:#1A1300;
  --prot:#3566D0; --fat:#C2457A; --carb:#D99A00;
  --ok:#2C8A55; --warn:#B86E00; --bad:#BF3A2C;
  --tape:#EBDDB0; --tape-ink:#3B2F12;
  --shadow:0 1px 0 rgba(20,25,20,.04),0 6px 18px -10px rgba(20,25,20,.18);
  --f-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-hand:"Caveat","Golos Text",cursive;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1210; --surface:#181C19; --surface2:#222723; --ink:#ECEFE9; --muted:#97A096; --line:#2B312C;
  --accent:#F2B21B; --accent-ink:#F2B21B; --on-accent:#1A1300;
  --prot:#7099FF; --fat:#EC74A6; --carb:#F2B21B;
  --ok:#4CC27F; --warn:#F0A23A; --bad:#F06A5A;
  --tape:#3B3524; --tape-ink:#F3E8C3;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 8px 20px -12px rgba(0,0,0,.6);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1210; --surface:#181C19; --surface2:#222723; --ink:#ECEFE9; --muted:#97A096; --line:#2B312C;
  --accent:#F2B21B; --accent-ink:#F2B21B; --on-accent:#1A1300;
  --prot:#7099FF; --fat:#EC74A6; --carb:#F2B21B;
  --ok:#4CC27F; --warn:#F0A23A; --bad:#F06A5A;
  --tape:#3B3524; --tape-ink:#F3E8C3;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 8px 20px -12px rgba(0,0,0,.6);
  color-scheme:dark}

*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.app{max-width:560px;margin:0 auto;padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
.num{font-variant-numeric:tabular-nums}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 10px}
.top-row{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.brand{font-family:var(--f-display);font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.brand b{color:var(--accent-ink);font-weight:700}
.sync{font-size:12px;color:var(--muted)}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:10px}
.day{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:6px 0 5px;display:flex;flex-direction:column;align-items:center;gap:1px;min-width:0}
.day .dw{font-size:12px;color:var(--muted);font-weight:600}
.day .dn{font-family:var(--f-display);font-size:15px;font-weight:500}
.day .dots{display:flex;gap:2px;height:5px;margin-top:2px}
.day .dots i{width:4px;height:4px;border-radius:50%;background:var(--line)}
.day .dots i.on{background:var(--accent)}
.day.today .dw{color:var(--accent-ink)}
.day.sel{background:var(--ink);border-color:var(--ink)}
.day.sel .dw,.day.sel .dn{color:var(--bg)}
.day.sel .dots i{background:color-mix(in srgb,var(--bg) 35%,transparent)}
.day.sel .dots i.on{background:var(--accent)}

/* generic */
h1,h2,h3{margin:0;text-wrap:balance}
.h1{font-family:var(--f-display);font-weight:700;font-size:26px;line-height:1.1;letter-spacing:-.01em}
.h2{font-family:var(--f-display);font-weight:500;font-size:17px;line-height:1.2}
.label{font-size:12px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:12px}
.sec{margin-top:22px;display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:10px}
.spacer{flex:1}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:500;padding:3px 9px;border-radius:999px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.chip.acc{background:color-mix(in srgb,var(--accent) 20%,transparent);color:var(--accent-ink)}
.chip.ok{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}
.chip.warn{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.chip.bad{background:color-mix(in srgb,var(--bad) 15%,transparent);color:var(--bad)}
.chip.ice{background:color-mix(in srgb,var(--prot) 14%,transparent);color:var(--prot)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--shadow)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;font-weight:600;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.pri{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.acc{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 11px;font-size:14px;border-radius:10px}
.btn.wide{width:100%}
.btn:disabled{opacity:.45}
.link{background:none;border:0;padding:0;color:var(--accent-ink);font-weight:600;font-size:14px}
.empty{padding:20px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r)}
input.qty{width:76px;padding:7px 8px;border:1px solid var(--line);border-radius:10px;background:var(--bg);text-align:right;font-variant-numeric:tabular-nums;font-size:16px}
.unit{font-size:13px;color:var(--muted);min-width:20px}

/* today */
.dayhead{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-top:6px}
.dayhead p{margin:4px 0 0;color:var(--muted)}
.macro{margin-top:16px;padding:16px}
.kcal{display:flex;align-items:baseline;gap:6px}
.kcal .big{font-family:var(--f-display);font-weight:700;font-size:34px;line-height:1}
.kcal .of{color:var(--muted)}
.bars{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.bar .bl{display:flex;flex-direction:column;font-size:12.5px;line-height:1.25;margin-bottom:6px;color:var(--muted)}
.bar .bl b{color:var(--ink);font-size:14px}
.bar .bl b{font-weight:600}
.bar .track{height:7px;border-radius:99px;background:var(--surface2);overflow:hidden}
.bar .fill{height:100%;border-radius:99px}
.bar.p .fill{background:var(--prot)} .bar.f .fill{background:var(--fat)} .bar.c .fill{background:var(--carb)}
.alert{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);border-left-width:4px}
.alert.acc{border-left-color:var(--accent)} .alert.ice{border-left-color:var(--prot)} .alert.bad{border-left-color:var(--bad)} .alert.warn{border-left-color:var(--warn)}
.alert .at{font-weight:600}
.alert p{margin:2px 0 0;font-size:14px;color:var(--muted)}
.alert .grow{flex:1;min-width:0}

.meal{display:flex;align-items:stretch;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.meal.next{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),var(--shadow)}
.meal-main{flex:1;min-width:0;text-align:left;background:none;border:0;padding:13px 14px;display:flex;flex-direction:column;gap:4px}
.meal-top{display:flex;align-items:center;gap:8px}
.slot{font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.meal.next .slot{color:var(--accent-ink)}
.time{font-size:12px;color:var(--muted)}
.meal h3{font-size:16.5px;font-weight:600;line-height:1.25}
.kbju{font-size:13px;color:var(--muted)}
.kbju .p{color:var(--prot)} .kbju .f{color:var(--fat)} .kbju .c{color:var(--carb);font-weight:600}
.meal-src{margin-top:3px;display:flex;flex-wrap:wrap;gap:6px}
.meal-side{display:flex;flex-direction:column;border-left:1px solid var(--line);width:68px;flex:none}
.eat{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted)}
.eat .ring{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center}
.eat .ring svg{width:16px;height:16px;opacity:0}
.meal.done .eat .ring{background:var(--ok);border-color:var(--ok)}
.meal.done .eat .ring svg{opacity:1;stroke:#fff}
.meal.done .eat{color:var(--ok)}
.skip{border:0;border-top:1px solid var(--line);background:none;font-size:11.5px;color:var(--muted);padding:7px 2px}
.meal.done h3,.meal.skipped h3{color:var(--muted)}
.meal.skipped{opacity:.7}
.meal.skipped h3{text-decoration:line-through}

.extra-row{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
.extra-row .grow{flex:1;min-width:0}

/* recipe / session */
.back{display:inline-flex;align-items:center;gap:4px;background:none;border:0;padding:6px 0;color:var(--muted);font-weight:600}
.rhead{margin-top:6px;display:flex;flex-direction:column;gap:8px}
.rmeta{display:flex;flex-wrap:wrap;gap:6px}
.macros4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:4px}
.m4{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.m4 .v{font-family:var(--f-display);font-weight:500;font-size:18px}
.m4 .k{font-size:12px;color:var(--muted)}
.m4.p .v{color:var(--prot)} .m4.f .v{color:var(--fat)} .m4.c .v{color:var(--carb)}
.seg{display:inline-flex;background:var(--surface2);border-radius:11px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:6px 12px;border-radius:9px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.ings{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.ings li{display:flex;gap:10px;align-items:baseline;padding:10px 14px;border-top:1px solid var(--line)}
.ings li:first-child{border-top:0}
.ings .iname{flex:1;min-width:0}
.ings .inote{display:block;font-size:13px;color:var(--muted)}
.ings .iq{font-weight:600;white-space:nowrap}
.ings .have{font-size:12px;white-space:nowrap}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;counter-reset:st}
.step{display:flex;gap:12px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);counter-increment:st}
.step::before{content:counter(st);font-family:var(--f-display);font-weight:700;font-size:15px;color:var(--accent-ink);min-width:18px}
.step .sb{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.step.done{opacity:.5}
.cook .step{font-size:19px;line-height:1.45}
.tbtn{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent-ink);border-radius:999px;padding:5px 12px;font-weight:600;font-size:14px}
.note{padding:12px 14px;border-radius:var(--r);background:color-mix(in srgb,var(--accent) 12%,var(--surface));border:1px solid color-mix(in srgb,var(--accent) 35%,var(--line));font-size:14.5px}
.sticky-act{position:sticky;bottom:calc(84px + env(safe-area-inset-bottom,0px));margin-top:18px;z-index:3}

/* fridge tape */
.tapes{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.tub{background:var(--surface);border:1px solid var(--line);border-radius:16px 16px 12px 12px;padding:22px 12px 12px;position:relative;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px;min-width:0}
.tape{position:absolute;top:-9px;left:12px;max-width:calc(100% - 24px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:var(--tape);color:var(--tape-ink);font-family:var(--f-hand);font-size:20px;font-weight:700;line-height:1.15;padding:3px 12px 2px;transform:rotate(-1.2deg);clip-path:polygon(0 6%,3% 0,97% 4%,100% 0,99% 94%,96% 100%,2% 96%,0 100%)}
.tub .tn{font-weight:600;line-height:1.25;margin-top:8px}
.tub .tm{font-size:13px;color:var(--muted)}
.tub .row{flex-wrap:wrap}
.cnt{font-family:var(--f-display);font-weight:700;font-size:20px}

/* pantry/shop */
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.li{display:flex;align-items:center;gap:10px;padding:10px 12px;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li .grow{flex:1;min-width:0}
.li .nm{font-weight:600;line-height:1.25}
.li .sub{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 8px;margin-top:2px}
.toggle{border:1px solid var(--line);background:var(--surface2);border-radius:999px;padding:5px 11px;font-size:13px;font-weight:600}
.toggle.low{background:color-mix(in srgb,var(--warn) 18%,transparent);border-color:transparent;color:var(--warn)}

/* weight */
.wform{display:flex;gap:8px;align-items:center}
.wform input{flex:1;min-width:0;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);font-size:18px;font-variant-numeric:tabular-nums}
.chart{width:100%;height:auto;display:block}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

/* overlays */
#timers{position:fixed;left:0;right:0;bottom:calc(68px + env(safe-area-inset-bottom,0px));z-index:7;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.timer{pointer-events:auto;width:100%;max-width:560px;display:flex;align-items:center;gap:10px;background:var(--ink);color:var(--bg);border-radius:14px;padding:9px 10px 9px 14px;box-shadow:0 10px 30px -10px rgba(0,0,0,.5)}
.timer .tt{font-family:var(--f-display);font-weight:700;font-size:20px;min-width:70px}
.timer .tl{flex:1;min-width:0;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.85}
.timer button{border:0;background:color-mix(in srgb,var(--bg) 18%,transparent);color:var(--bg);border-radius:10px;padding:6px 10px;font-weight:600;font-size:13px}
.timer.ring{background:var(--accent);color:var(--on-accent)}
.timer.ring button{color:var(--on-accent);background:rgba(0,0,0,.12)}
@media (prefers-reduced-motion:no-preference){.timer.ring{animation:pulse 1s ease-in-out infinite}}
@keyframes pulse{50%{transform:scale(1.02)}}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:8;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tabs-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0;font-size:11px;font-weight:600;color:var(--muted);position:relative}
.tab svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--ink)}
.tab.on svg{stroke:var(--accent-ink)}
.badge{position:absolute;top:0;left:calc(50% + 6px);min-width:17px;height:17px;padding:0 4px;border-radius:99px;background:var(--accent);color:var(--on-accent);font-size:10.5px;font-weight:700;display:grid;place-items:center}

.sheet{display:flex;flex-direction:column;gap:10px}
.preset{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:11px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.preset .grow{flex:1;min-width:0}
.form{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.form input{width:100%;min-width:0;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-variant-numeric:tabular-nums}
.form .full{grid-column:1/-1}
.form label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);min-width:0}
</style>

<div class="app">
  <header class="top" id="top"></header>
  <main id="main"></main>
</div>
<div id="timers"></div>

/* ================= ДАТЫ ================= */
const DW = ["Пн","Вт","Ср","Чт","Пт","Сб","Вс"];
const DW_FULL = ["Понедельник","Вторник","Среда","Четверг","Пятница","Суббота","Воскресенье"];
const DW_GEN = ["понедельника","вторника","среды","четверга","пятницы","субботы","воскресенья"];
const DW_ACC = ["в понедельник","во вторник","в среду","в четверг","в пятницу","в субботу","в воскресенье"];
const MON = ["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];
const pad = n => String(n).padStart(2,"0");
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y,m-1,d); };
const addD = (s,n) => { const d = parse(s); d.setDate(d.getDate()+n); return iso(d); };
const wd = s => (parse(s).getDay()+6)%7;
const todayISO = () => iso(new Date());
const dateLong = s => { const d = parse(s); return `${d.getDate()} ${MON[d.getMonth()]}`; };
const dShort = s => { const d = parse(s); return `${DW[wd(s)]} ${pad(d.getDate())}.${pad(d.getMonth()+1)}`; };
const diffD = (a,b) => Math.round((parse(b)-parse(a))/864e5);
function untilDay(s){ const n = diffD(todayISO(),s); if(n===0) return "сегодня"; if(n===1) return "завтра"; return n>1&&n<7 ? DW_GEN[wd(s)] : dShort(s); }
function relDay(s){ const t = todayISO(), n = diffD(t,s);
  if(n===0) return "сегодня"; if(n===1) return "завтра"; if(n===-1) return "вчера";
  return n>1 && n<7 ? DW_ACC[wd(s)] : dShort(s); }

const LS_KEY = "massa-menu-v1";
function blank(){ return {v:1,updatedAt:0,pantry:{},staples:{},fridge:[],log:{},bought:[],weight:[]}; }

try{ const raw = localStorage.getItem(LS_KEY); if(raw){ const o = JSON.parse(raw); if(o && o.v===1) S = Object.assign(blank(),o); } }catch(e){}

const uid = () => Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const dayLog = d => (S.log[d] ||= {slots:{},extras:[],sessions:{}});
const peekLog = d => S.log[d] || {slots:{},extras:[],sessions:{}};

function commit(){
  S.updatedAt = Date.now();
  pruneLog();
  try{ localStorage.setItem(LS_KEY, JSON.stringify(S)); }catch(e){}
  Sync.push();
  render();
}
function pruneLog(){
  const lim = addD(todayISO(),-60);
  for(const d of Object.keys(S.log)) if(d < lim) delete S.log[d];
  S.bought = S.bought.filter(b => b.date >= addD(todayISO(),-14));
  if(S.weight.length>400) S.weight = S.weight.slice(-400);
}

/* ================= ЛОГИКА СКЛАДА ================= */
const tracked = id => P[id] && !P[id].staple;
function rawFor(rid, mode){ // mode: "full" | "serve" | "batch"
  const r = R[rid], serve = r.serve || [];
  return r.ing.filter(([id,,,flag]) => {
    if(flag==="pre") return false;
    if(mode==="serve") return serve.includes(id);
    if(mode==="batch") return !serve.includes(id);
    return true; });
}
function fridgeCount(key){ return S.fridge.filter(f=>f.key===key).reduce((a,f)=>a+f.n,0); }
function takePantry(id, q, use){
  if(!tracked(id) || !q) return;
  const have = S.pantry[id]||0, t = Math.min(have,q);
  S.pantry[id] = Math.round((have - t)*100)/100;
  if(t>0) use.pantry[id] = (use.pantry[id]||0)+t;
}
function restore(use){
  if(!use) return;
  for(const [id,q] of Object.entries(use.pantry||{})) S.pantry[id] = Math.round(((S.pantry[id]||0)+q)*100)/100;
  for(const f of (use.fridge||[])){
    const ex = S.fridge.find(x=>x.id===f.id);
    if(ex) ex.n += 1; else S.fridge.push({...f,n:1});
  }
}
function eatMeal(date, slot){
  const rid = MENU[wd(date)][slot], r = R[rid];
  const use = {pantry:{},fridge:[]};
  let raw;
  if(r.batch && fridgeCount(r.batch)>0){
    const f = S.fridge.filter(x=>x.key===r.batch).sort((a,b)=>a.cooked<b.cooked?-1:1)[0];
    use.fridge.push({...f,n:1}); f.n -= 1;
    if(f.n<=0) S.fridge = S.fridge.filter(x=>x!==f);
    raw = rawFor(rid,"serve");
  } else raw = rawFor(rid,"full");
  for(const [id,q] of raw) takePantry(id,q,use);
  dayLog(date).slots[slot] = {st:"eaten",use,from:use.fridge.length?"fridge":"fresh"};
  commit();
}
function skipMeal(date,slot){ dayLog(date).slots[slot] = {st:"skipped"}; commit(); }
function undoMeal(date,slot){
  const L = dayLog(date), e = L.slots[slot]; if(!e) return;
  restore(e.use); delete L.slots[slot]; commit();
}
function doSession(sid){
  const d = todayISO(), s = SESSIONS[sid], use = {pantry:{},fridge:[]}, made = [];
  for(const m of s.makes){
    for(const [id,q] of rawFor(m.r,"batch")) takePantry(id,q*m.n,use);
    const it = {id:uid(),key:R[m.r].batch,cooked:d,until:addD(d,m.keep),n:m.n,freeze:m.freeze?1:0};
    S.fridge.push(it); made.push(it.id);
  }
  for(const [id,q] of (s.extra||[])) takePantry(id,q,use);
  dayLog(d).sessions[sid] = {use,made};
  commit();
}
function undoSession(date,sid){
  const L = dayLog(date), e = L.sessions[sid]; if(!e) return;
  restore(e.use); S.fridge = S.fridge.filter(f=>!e.made.includes(f.id));
  delete L.sessions[sid]; commit();
}
// выполнена ли плановая заготовка на дату X (делал в окне X-2…X+1)
function sessionDoneAt(sid, X){
  for(let i=-2;i<=1;i++){ const d = addD(X,i); if(S.log[d] && S.log[d].sessions && S.log[d].sessions[sid]) return d; }
  return null;
}
function sessionsOn(date){ return SESSION_ORDER.filter(id=>SESSIONS[id].day===wd(date)); }

/* Симуляция: что и когда будет списываться начиная с from (включительно) до to (не включая) */
function simulate(from, to, pantry0, fridge0){
  const pantry = {...pantry0}, fr = {...fridge0};
  const need = {}, firstShort = {}, uses = {}; // uses[id] = [{d,q}]
  const consume = (d,id,q) => {
    if(!tracked(id)||!q) return;
    need[id] = (need[id]||0)+q;
    pantry[id] = (pantry[id]||0)-q;
    (uses[id] ||= []).push({d,q});
    if(pantry[id] < -1e-6 && !firstShort[id]) firstShort[id] = d;
  };
  for(let d=from; d<to; d=addD(d,1)){
    const L = peekLog(d), w = wd(d);
    const sess = sessionsOn(d).filter(id => !sessionDoneAt(id,d));
    const run = id => { for(const m of SESSIONS[id].makes){ for(const [pid,q] of rawFor(m.r,"batch")) consume(d,pid,q*m.n); const k=R[m.r].batch; fr[k]=(fr[k]||0)+m.n; } for(const [pid,q] of (SESSIONS[id].extra||[])) consume(d,pid,q); };
    sess.filter(id=>SESSIONS[id].when==="morning").forEach(run);
    for(const sl of SLOTS){
      if(L.slots[sl.k]) continue;
      const rid = MENU[w][sl.k], r = R[rid];
      let raw;
      if(r.batch && (fr[r.batch]||0)>0){ fr[r.batch]--; raw = rawFor(rid,"serve"); }
      else raw = rawFor(rid,"full");
      for(const [id,q] of raw) consume(d,id,q);
    }
    sess.filter(id=>SESSIONS[id].when==="evening").forEach(run);
  }
  return {need,pantry,firstShort,uses,fridge:fr};
}
function fridgeMap(){ const m={}; for(const f of S.fridge) m[f.key]=(m[f.key]||0)+f.n; return m; }
function nextTrip(from){ for(let i=0;i<8;i++){ const d=addD(from,i); if(TRIP_DAYS.includes(wd(d))) return d; } return from; }

function roundBuy(id,q){
  const p = P[id];
  if(p.pack && p.pack>1) return Math.ceil(q/p.pack - 1e-9)*p.pack;
  if(p.step) return Math.ceil(q/p.step - 1e-9)*p.step;
  return Math.ceil(q - 1e-9);
}
function fmtQ(q,u){
  if(u==="г" && q>=1000) return (Math.round(q/100)/10).toString().replace(".",",")+" кг";
  if(u==="мл" && q>=1000) return (Math.round(q/100)/10).toString().replace(".",",")+" л";
  if(u==="шт" && q%1!==0){ const w=Math.floor(q); return (w?w+"½":"½")+" шт"; }
  return (Math.round(q*10)/10).toString().replace(".",",")+(u?" "+u:"");
}
function shopping(){
  const T = todayISO(), trip = nextTrip(T), after = nextTrip(addD(trip,1));
  const urgent = simulate(T, trip, S.pantry, fridgeMap());
  const urgentDef = {};
  for(const [id,v] of Object.entries(urgent.pantry)) if(v < -1e-6) urgentDef[id] = -v;
  const p2 = {}; for(const [id,v] of Object.entries(urgent.pantry)) p2[id] = Math.max(0,v);
  for(const [id,v] of Object.entries(S.pantry)) if(!(id in p2)) p2[id]=v;
  const tripSim = simulate(trip, after, p2, urgent.fridge);
  const tripDef = {};
  for(const [id,v] of Object.entries(tripSim.pantry)) if(v < -1e-6) tripDef[id] = -v;
  // первое использование мяса — для подсказки «в морозилку»
  const firstUse = {}; const all = simulate(T, addD(T,8), S.pantry, fridgeMap());
  for(const [id,arr] of Object.entries(all.uses)) firstUse[id] = arr[0].d;
  return {T,trip,after,urgentDef,tripDef,firstUse};
}

/* ================= SYNC (db) ================= */
const Sync = (()=>{
  let ref=null, busy=false, again=false, timer=null, status="local";
  async function init(){
    try{
      if(!window.claude || !window.claude.use) return;
      const [db,user] = await Promise.all([window.claude.use("db"),window.claude.use("user")]);
      if(!db || !user) return;
      const id = await user.id(); if(!id) return;
      ref = db.doc("data/users/"+id+"/menu");
      const snap = await ref.get();
      const remote = snap.exists ? snap.data() : null;
      if(remote && remote.v===1 && (remote.updatedAt||0) > (S.updatedAt||0)){
        S = Object.assign(blank(), JSON.parse(JSON.stringify(remote)));
        try{ localStorage.setItem(LS_KEY, JSON.stringify(S)); }catch(e){}
      } else if(S.updatedAt && (!remote || (remote.updatedAt||0) < S.updatedAt)) { push(true); }
      status="cloud"; render();
      ref.onSnapshot(s=>{
        if(!s.exists || s.metadata.hasPendingWrites) return;
        const r = s.data();
        if(r && r.v===1 && (r.updatedAt||0) > (S.updatedAt||0)){
          S = Object.assign(blank(), JSON.parse(JSON.stringify(r)));
          try{ localStorage.setItem(LS_KEY, JSON.stringify(S)); }catch(e){}
          render();
        }
      }, ()=>{});
    }catch(e){ status="local"; }
  }
  async function write(){
    if(!ref) return;
    if(busy){ again=true; return; }
    busy=true;
    try{ await ref.set(JSON.parse(JSON.stringify(S))); status="cloud"; }
    catch(e){ if(e && e.code==="unavailable"){ setTimeout(push, 1500+Math.random()*1500); } else status="local"; }
    busy=false;
    if(again){ again=false; write(); }
  }
  function push(now){ if(!ref) return; clearTimeout(timer); timer=setTimeout(write, now?0:700); }
  return {init,push,get status(){return status;}};
})();

const timers = [];
let actx=null;
function beep(){
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    const t0 = actx.currentTime;
    for(let i=0;i<3;i++){
      const o=actx.createOscillator(), g=actx.createGain();
      o.type="sine"; o.frequency.value=880;
      g.gain.setValueAtTime(0.0001,t0+i*0.35); g.gain.exponentialRampToValueAtTime(0.3,t0+i*0.35+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t0+i*0.35+0.25);
      o.connect(g).connect(actx.destination); o.start(t0+i*0.35); o.stop(t0+i*0.35+0.3);
    }
  }catch(e){}
  try{ navigator.vibrate && navigator.vibrate([200,100,200]); }catch(e){}
}
function startTimer(sec,label){
  try{ actx = actx || new (window.AudioContext||window.webkitAudioContext)(); actx.resume && actx.resume(); }catch(e){}
  timers.push({id:uid(),end:Date.now()+sec*1000,label,rang:false});
  drawTimers();
}
const mmss = s => { s=Math.max(0,Math.ceil(s)); const h=Math.floor(s/3600), m=Math.floor(s%3600/60), x=s%60; return (h? h+":"+pad(m) : m)+":"+pad(x); };
function drawTimers(){
  const box = document.getElementById("timers");
  box.innerHTML = timers.map(t=>{

}
setInterval(()=>{

},1000);

function sourceChip(d, sl, rid){
  const r = R[rid], T = todayISO();
  const e = peekLog(d).slots[sl];
  if(e){ if(e.st==="eaten") return `<span class="chip ok">съедено${e.from==="fridge"?" · из холодильника":""}</span>`; return `<span class="chip">не ел</span>`; }
  if(d < T) return "";
  if(r.kind==="l") return `<span class="chip">без готовки</span>`;
  if(r.kind==="p") return TRAIN.includes(wd(d)) ? `<span class="chip acc">после зала</span>` : `<span class="chip">2 минуты</span>`;
  if(r.batch){
    // моделируем холодильник от сегодня до этого приёма
    const fr = fridgeMap(); let avail = null, src = null;
    for(let x=T; x<=d; x=addD(x,1)){
      const L = peekLog(x), w = wd(x);
      const sess = sessionsOn(x).filter(id=>!sessionDoneAt(id,x));
      for(const id of sess.filter(i=>SESSIONS[i].when==="morning")) for(const m of SESSIONS[id].makes){ const k=R[m.r].batch; fr[k]=(fr[k]||0)+m.n; if(k===r.batch) src=x; }
      for(const s2 of SLOTS){
        if(L.slots[s2.k]) continue;
        const r2 = R[MENU[w][s2.k]];
        if(x===d && s2.k===sl){ avail = (fr[r.batch]||0)>0; break; }
        if(r2.batch && (fr[r2.batch]||0)>0) fr[r2.batch]--;
      }
      if(avail!==null) break;
      for(const id of sess.filter(i=>SESSIONS[i].when==="evening")) for(const m of SESSIONS[id].makes){ const k=R[m.r].batch; fr[k]=(fr[k]||0)+m.n; if(k===r.batch) src=x; }
    }
    if(avail){
      if(src) return `<span class="chip">из заготовки ${src===T?"сегодня":DW[wd(src)]}</span>`;
      return r.batch==="syrniki" ? `<span class="chip ice">в морозилке</span>` : `<span class="chip ok">в холодильнике</span>`;
    }
    return `<span class="chip warn">в холодильнике нет · готовь свежим</span>`;
  }
  return `<span class="chip">свежее · ${r.time} мин</span>`;
}

function viewPrep(){
  const T = todayISO(), ws = addD(T,-wd(T));
  let h = `<div class="rhead" style="margin-top:6px"><h1 class="h1">Заготовки</h1><p class="muted" style="margin:0">Четыре готовки в неделю. Отметь «Заготовка сделана», и контейнеры появятся в холодильнике, а продукты спишутся с кладовки.</p></div><section class="sec">`;
  const order = [...SESSION_ORDER].sort((a,b)=>{ const da=(SESSIONS[a].day-wd(T)+7)%7, db=(SESSIONS[b].day-wd(T)+7)%7; return da-db; });
  for(const sid of order){
    const s = SESSIONS[sid]; const planned = addD(ws,s.day); const done = sessionDoneAt(sid,planned);
    const next = (s.day-wd(T)+7)%7;
    h += `<button class="card" style="text-align:left;display:flex;flex-direction:column;gap:6px" data-act="open-session" data-id="${sid}">
      <div class="row"><span class="label">${DW_FULL[s.day]} · ${s.when==="morning"?"утро":"вечер"}</span><span class="spacer"></span>${done?`<span class="chip ok">сделано ${dShort(done)}</span>`:(next===0?`<span class="chip acc">сегодня</span>`:`<span class="chip">через ${next} дн.</span>`)}</div>
      <div class="h2">${s.n}</div>
      <div class="muted" style="font-size:14px">${s.makes.map(x=>BATCH_NAME[R[x.r].batch]+" ×"+x.n).join(" · ")} ${s.covers} · около ${s.time} мин</div></button>`;
  }
  h += `</section>`;
  return h;
}
function viewSession(){
  const sid = UI.view.id, s = SESSIONS[sid], T = todayISO();
  const doneToday = peekLog(T).sessions && peekLog(T).sessions[sid];
  // суммарные ингредиенты
  const tot = {}, notes = {};
  for(const m of s.makes) for(const [id,q,note] of rawFor(m.r,"batch")){ tot[id]=(tot[id]||0)+q*m.n; if(note && !notes[id]) notes[id]=note; }
  let h = `<button class="back" data-act="close">${ICON.back} Заготовки</button>
  <div class="rhead"><div class="label">${DW_FULL[s.day]} · ${s.when==="morning"?"утро":"вечер"} · около ${s.time} мин</div><h1 class="h1">${s.n}</h1>
  <div class="rmeta">${s.makes.map(x=>`<span class="chip acc">${BATCH_NAME[R[x.r].batch]} ×${x.n}</span>`).join("")}<span class="chip">${s.covers}</span></div></div>`;
  if(s.note) h += `<section class="sec"><div class="note">${s.note}</div></section>`;
  h += `<section class="sec"><h2 class="h2">Понадобится</h2><ul class="ings">`;
  for(const [id,q] of Object.entries(tot)){
    const p = P[id];
    if(p.staple){ h += `<li><span class="iname">${p.n}</span><span class="iq">${S.staples[id]==="low"?`<span class="have" style="color:var(--warn)">заканчивается</span>`:""}</span></li>`; continue; }
    const have = S.pantry[id]||0;
    h += `<li><span class="iname">${p.n}</span>${have>=q?`<span class="have" style="color:var(--ok)">есть</span>`:`<span class="have" style="color:var(--warn)">есть ${fmtQ(have,p.u)}</span>`}<span class="iq num">${fmtQ(q,p.u)}</span></li>`;
  }
  h += `</ul></section>`;
  h += `<section class="sec ${UI.cook?"cook":""}"><div class="row"><h2 class="h2">Порядок действий</h2><span class="spacer"></span><button class="btn sm ${UI.cook?"acc":""}" data-act="cook">${UI.cook?"Режим готовки вкл.":"Режим готовки"}</button></div><ol class="steps">${stepsHTML(s.steps,"s:"+sid)}</ol></section>`;
  h += `<div class="sticky-act">${doneToday?`<button class="btn wide" data-act="undo-session" data-id="${sid}">Отменить: заготовка не сделана</button>`:`<button class="btn acc wide" data-act="do-session" data-id="${sid}">Заготовка сделана</button>`}</div>`;
  return h;
}

function viewStock(){
  const T = todayISO();
  let h = `<div class="rhead" style="margin-top:6px"><h1 class="h1">Склад</h1></div>
  <div class="seg" style="margin-top:12px"><button class="${UI.stockTab==="fridge"?"on":""}" data-act="stock-tab" data-t="fridge">Холодильник</button><button class="${UI.stockTab==="pantry"?"on":""}" data-act="stock-tab" data-t="pantry">Кладовка</button></div>`;
  if(UI.stockTab==="fridge"){
    const items = [...S.fridge].sort((a,b)=>a.until<b.until?-1:1);
    h += `<section class="sec">`;
    if(!items.length) h += `<div class="empty">Готовых контейнеров нет. Сделай заготовку на вкладке «Заготовки», и они появятся здесь с датой приготовления.</div>`;
    else {
      h += `<div class="tapes">`;
      for(const f of items){
        const st = f.freeze ? `<span class="chip ice">морозилка</span>` : f.until<T ? `<span class="chip bad">просрочено</span>` : f.until===T ? `<span class="chip warn">съесть сегодня</span>` : `<span class="chip ok">до ${untilDay(f.until)}</span>`;
        h += `<div class="tub"><div class="tape">${DW[wd(f.cooked)]} ${pad(parse(f.cooked).getDate())}.${pad(parse(f.cooked).getMonth()+1)}</div>
          <div class="tn">${BATCH_NAME[f.key]}</div><div class="row"><span class="cnt num">×${f.n}</span><span class="spacer"></span>${st}</div>
          <div class="row"><button class="btn sm" data-act="fr-minus" data-id="${f.id}">−1</button><button class="btn sm" data-act="fr-plus" data-id="${f.id}">+1</button></div></div>`;
      }
      h += `</div><p class="muted" style="font-size:13px;margin:4px 0 0">«−1» — если выбросил или отдал порцию. Съеденное списывается само, когда отмечаешь «Съел».</p>`;
    }
    h += `</section>`;
  } else {
    const sim = simulate(T, addD(T,7), S.pantry, fridgeMap());
    const sh = shopping();
    h += `<p class="muted" style="margin:12px 0 0;font-size:14px">Это и есть сверка: если в реальности продукта больше или меньше, просто поправь число.</p>`;
    CATS.forEach((cat,ci)=>{
      const ids = Object.keys(P).filter(id=>P[id].cat===ci && !P[id].staple);
      if(!ids.length) return;
      h += `<section class="sec"><h2 class="label">${cat}</h2><div class="list">`;
      for(const id of ids){
        const p = P[id], have = S.pantry[id]||0;
        let status = "";
        if(sim.firstShort[id]) status = sim.firstShort[id]===T ? `<span style="color:var(--bad)">не хватает уже сегодня</span>` : `<span style="color:var(--warn)">закончится ${relDay(sim.firstShort[id])}</span>`;
        else if(sim.need[id]) status = `<span style="color:var(--ok)">хватит на неделю</span>`;
        else status = `<span>на этой неделе не нужен</span>`;
        let ice = "";
        if(p.meat && have>0 && sh.firstUse[id] && diffD(T,sh.firstUse[id])>=2) ice = `<span class="chip ice">в морозилку · нужно ${relDay(sh.firstUse[id])}</span>`;
        h += `<div class="li"><div class="grow"><div class="nm">${p.n}</div><div class="sub">${status}${ice}</div></div><input class="qty" type="number" inputmode="decimal" min="0" step="any" id="pq-${id}" data-act="pantry" data-id="${id}" value="${Math.round(have*10)/10}" aria-label="${p.n}, количество"><span class="unit">${p.u}</span></div>`;
      }
      h += `</div></section>`;
    });
    const stp = Object.keys(P).filter(id=>P[id].staple);
    h += `<section class="sec"><h2 class="label">Соусы, специи, бакалея</h2><p class="muted" style="margin:0;font-size:13px">Граммы тут не считаем. Нажми, когда что-то кончается, и оно попадёт в покупки.</p><div class="list">`;
    for(const id of stp){ const low = S.staples[id]==="low"; h += `<div class="li"><div class="grow"><div class="nm">${P[id].n}</div></div><button class="toggle ${low?"low":""}" data-act="staple" data-id="${id}">${low?"заканчивается":"есть"}</button></div>`; }
    h += `</div></section>`;
  }
  return h;
}

function viewShop(){
  const sh = shopping(), T = todayISO();
  const tripToday = sh.trip===T;
  let h = `<div class="rhead" style="margin-top:6px"><h1 class="h1">Покупки</h1><p class="muted" style="margin:0">Закупки по воскресеньям и средам. Список считается сам: меню минус то, что уже лежит дома.</p></div>`;
  const lineGroup = (def, title, sub, key) => {
    const ids = Object.keys(def).sort((a,b)=>P[a].cat-P[b].cat);
    if(!ids.length) return "";
    let g = `<section class="sec"><div><h2 class="h2">${title}</h2><p class="muted" style="margin:2px 0 0;font-size:14px">${sub}</p></div><div class="list">`;
    for(const id of ids){
      const p = P[id], need = def[id], buy = roundBuy(id,need), have = S.pantry[id]||0;
      const ice = p.meat && sh.firstUse[id] && diffD(sh.trip<=T?T:sh.trip, sh.firstUse[id])>=2 ? `<span class="chip ice">дома сразу в морозилку</span>` : "";
      g += `<div class="li"><div class="grow"><div class="nm">${p.n}</div><div class="sub"><span>не хватает ${fmtQ(need,p.u)}</span>${have?`<span>дома ${fmtQ(have,p.u)}</span>`:""}${ice}</div></div>
        <input class="qty" type="number" inputmode="decimal" min="0" step="any" id="bq-${key}-${id}" value="${buy}" aria-label="Сколько купил: ${p.n}"><span class="unit">${p.u}</span>
        <button class="btn sm pri" data-act="buy" data-id="${id}" data-key="${key}">Купил</button></div>`;
    }
    return g + `</div></section>`;
  };
  const hasU = Object.keys(sh.urgentDef).length, hasT = Object.keys(sh.tripDef).length;
  if(!tripToday) h += lineGroup(sh.urgentDef, `Нужно до ${untilDay(sh.trip)}`, `Этого не хватит уже до ближайшей закупки ${relDay(sh.trip)}.`, "u");
  h += lineGroup(sh.tripDef, tripToday?"Закупка сегодня":`Закупка ${relDay(sh.trip)}, ${dShort(sh.trip)}`, `Хватит до ${untilDay(addD(sh.after,-1))} включительно, следующая закупка ${relDay(sh.after)}.`, "t");
  const low = Object.keys(S.staples).filter(k=>S.staples[k]==="low");
  if(low.length){
    h += `<section class="sec"><h2 class="h2">Заканчивается</h2><div class="list">${low.map(id=>`<div class="li"><div class="grow"><div class="nm">${P[id].n}</div></div><button class="btn sm pri" data-act="staple-bought" data-id="${id}">Купил</button></div>`).join("")}</div></section>`;
  }
  if(!hasU && !hasT && !low.length) h += `<section class="sec"><div class="empty">Всё есть до ${untilDay(addD(sh.after,-1))} включительно. Можно в магазин не ходить.</div></section>`;
  const recent = S.bought.filter(b=>b.date>=addD(T,-1)).slice().reverse();
  if(recent.length){
    h += `<section class="sec"><h2 class="label">Недавно добавлено в кладовку</h2><div class="list">${recent.map(b=>`<div class="li"><div class="grow"><div class="nm">${P[b.prod].n}</div><div class="sub"><span>${fmtQ(b.qty,P[b.prod].u)} · ${relDay(b.date)}</span></div></div><button class="btn sm ghost" data-act="unbuy" data-id="${b.id}">Отменить</button></div>`).join("")}</div></section>`;
  }
  if(!Object.values(S.pantry).some(v=>v>0)) h += `<section class="sec"><div class="note">Первый запуск: кладовка пуста, поэтому в списке всё. Купи по списку и жми «Купил» у каждой позиции. Если что-то уже есть дома, впиши это на вкладке «Склад → Кладовка».</div></section>`;
  return h;
}

function avgAround(end){ const st=addD(end,-6); const xs=S.weight.filter(w=>w.d>=st && w.d<=end).map(w=>w.kg); return xs.length? xs.reduce((a,b)=>a+b,0)/xs.length : null; }
function viewWeight(){
  const T = todayISO(), ws = [...S.weight].sort((a,b)=>a.d<b.d?-1:1);
  const cur = avgAround(T), prev = avgAround(addD(T,-14));
  let h = `<div class="rhead" style="margin-top:6px"><h1 class="h1">Вес</h1><p class="muted" style="margin:0">Взвешивайся утром натощак 3–4 раза в неделю. Смотри на среднее за неделю: дневные скачки на 0,5–1 кг — это вода.</p></div>
  <section class="sec"><form class="wform" id="wf"><input id="wkg" type="number" inputmode="decimal" step="0.1" min="30" max="200" placeholder="Вес сегодня, кг" value="${(S.weight.find(w=>w.d===T)||{}).kg||""}"><button class="btn pri" type="submit">Сохранить</button></form></section>`;
  const fmt = x => x==null ? "—" : x.toFixed(1).replace(".",",");
  const delta = cur!=null && prev!=null ? cur-prev : null;
  h += `<section class="sec stats">
    <div class="m4"><div class="v num">${fmt(cur)}</div><div class="k">среднее за 7 дней</div></div>
    <div class="m4"><div class="v num">${fmt(prev)}</div><div class="k">2 недели назад</div></div>
    <div class="m4 c"><div class="v num">${delta==null?"—":(delta>=0?"+":"")+fmt(delta)}</div><div class="k">изменение</div></div></section>`;
  let adv;
  if(delta==null) adv = `Совет появится, когда наберётся две недели взвешиваний. Нормальный темп набора: +0,25–0,5 кг в неделю, то есть +0,5–1 кг за две.`;
  else if(delta < 0.25) adv = `<b>Вес почти не растёт.</b> Добавь около 200 ккал в день: +50 г риса или пасты в обед и ещё один банан. Через две недели проверь снова.`;
  else if(delta > 1.4) adv = `<b>Набор быстрее 0,7 кг в неделю.</b> Часть может уходить в жир. Можно убрать сок на завтрак или половину ланча.`;
  else adv = `<b>Темп хороший.</b> Ничего не меняй и продолжай.`;
  h += `<section class="sec"><div class="note">${adv}</div></section>`;
  if(ws.length>=2) h += `<section class="sec card">${chartSVG(ws)}</section>`;
  if(ws.length){
    h += `<section class="sec"><h2 class="label">Записи</h2><div class="list">${ws.slice(-10).reverse().map(w=>`<div class="li"><div class="grow"><div class="nm num">${w.kg.toFixed(1).replace(".",",")} кг</div><div class="sub">${dShort(w.d)}</div></div><button class="btn sm ghost" data-act="del-w" data-d="${w.d}">Удалить</button></div>`).join("")}</div></section>`;
  }
  return h;
}
function chartSVG(ws){
  const W=340,H=170,pl=34,pr=10,pt=12,pb=24;
  const d0 = ws[0].d, d1 = ws[ws.length-1].d, span = Math.max(1,diffD(d0,d1));
  const avg = ws.map(w=>({d:w.d,v:avgAround(w.d)}));
  const all = ws.map(w=>w.kg).concat(avg.map(a=>a.v));
  let lo = Math.floor(Math.min(...all)*2)/2 - 0.5, hi = Math.ceil(Math.max(...all)*2)/2 + 0.5;
  const x = d => pl + diffD(d0,d)/span*(W-pl-pr), y = v => pt + (hi-v)/(hi-lo)*(H-pt-pb);
  const step = (hi-lo)>4 ? 1 : 0.5;
  let g = "";
  for(let v=Math.ceil(lo/step)*step; v<=hi+1e-9; v+=step){ g += `<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${pl-6}" y="${y(v)+4}" text-anchor="end" font-size="10" fill="var(--muted)">${v.toFixed(1).replace(".",",")}</text>`; }
  const pts = ws.map(w=>`<circle cx="${x(w.d)}" cy="${y(w.kg)}" r="3" fill="var(--muted)" opacity=".55"/>`).join("");
  const line = avg.map((a,i)=>`${i?"L":"M"}${x(a.d).toFixed(1)},${y(a.v).toFixed(1)}`).join("");
  const area = line + `L${x(d1).toFixed(1)},${H-pb}L${x(d0).toFixed(1)},${H-pb}Z`;
  const last = avg[avg.length-1];
  return `<div class="label" style="margin-bottom:6px">Среднее за 7 дней и отдельные взвешивания</div><svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="График веса">${g}
    <path d="${area}" fill="var(--accent)" opacity=".12"/><path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>${pts}
    <circle cx="${x(last.d)}" cy="${y(last.v)}" r="5" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>
    <text x="${pl}" y="${H-6}" font-size="10" fill="var(--muted)">${dShort(d0)}</text><text x="${W-pr}" y="${H-6}" font-size="10" text-anchor="end" fill="var(--muted)">${dShort(d1)}</text></svg>`;
}

function render(){
  renderTop(); renderTabs();
  const main = document.getElementById("main");
  let h;
  if(UI.view){
    if(UI.view.type==="recipe") h = viewRecipe();
    else if(UI.view.type==="session") h = viewSession();
    else if(UI.view.type==="extra") h = viewExtra();
  } else if(UI.tab==="today") h = viewToday();
  else if(UI.tab==="prep") h = viewPrep();
  else if(UI.tab==="stock") h = viewStock();
  else if(UI.tab==="shop") h = viewShop();
  else h = viewWeight();
  main.innerHTML = h;
}

/* ================= СОБЫТИЯ ================= */
function openView(v){ UI.view = v; UI.portions = 1; render(); window.scrollTo(0,0); }
function closeView(){ UI.view = null; if(UI.cook){ UI.cook=false; setWake(false); } render(); window.scrollTo(0,0); }
document.addEventListener("click", ev=>{
  const el = ev.target.closest("[data-act]"); if(!el) return;
  const a = el.dataset.act;
  if(el.tagName==="INPUT") return;
  if(a!=="step") ev.preventDefault();
  const date = UI.view && UI.view.date ? UI.view.date : UI.date;
  switch(a){
    case "tab": UI.tab = el.dataset.t; UI.view = null; if(UI.cook){UI.cook=false;setWake(false);} render(); window.scrollTo(0,0); break;
    case "day": UI.date = el.dataset.d; render(); break;
    case "open-meal": openView({type:"recipe",date:UI.date,slot:el.dataset.slot}); break;
    case "open-session": openView({type:"session",id:el.dataset.id}); break;
    case "open-extra": openView({type:"extra",date:UI.date}); break;
    case "close": closeView(); break;
    case "eat": eatMeal(date, el.dataset.slot); break;
    case "skip": skipMeal(date, el.dataset.slot); break;
    case "undo": undoMeal(date, el.dataset.slot); break;
    case "do-session": doSession(el.dataset.id); break;
    case "undo-session": undoSession(todayISO(), el.dataset.id); break;
    case "portions": UI.portions = +el.dataset.n; render(); break;
    case "cook": UI.cook = !UI.cook; setWake(UI.cook); render(); break;
    case "step": { if(ev.target.closest(".tbtn")) break; const k=el.dataset.key, i=el.dataset.i; (UI.doneSteps[k] ||= {})[i] = !UI.doneSteps[k][i]; el.classList.toggle("done"); break; }
    case "timer": ev.stopPropagation(); startTimer(+el.dataset.sec, el.dataset.label); break;
    case "tstop": { const i = timers.findIndex(t=>t.id===el.dataset.id); if(i>=0) timers.splice(i,1); drawTimers(); break; }
    case "tplus": { const t = timers.find(t=>t.id===el.dataset.id); if(t){ t.end += 60000; } drawTimers(); break; }
    case "stock-tab": UI.stockTab = el.dataset.t; render(); break;
    case "fr-minus": { const f = S.fridge.find(x=>x.id===el.dataset.id); if(f){ f.n--; if(f.n<=0) S.fridge = S.fridge.filter(x=>x!==f); commit(); } break; }
    case "fr-plus": { const f = S.fridge.find(x=>x.id===el.dataset.id); if(f){ f.n++; commit(); } break; }
    case "staple": { const id=el.dataset.id; if(S.staples[id]==="low") delete S.staples[id]; else S.staples[id]="low"; commit(); break; }
    case "staple-bought": delete S.staples[el.dataset.id]; commit(); break;
    case "buy": {
      const id = el.dataset.id, inp = document.getElementById(`bq-${el.dataset.key}-${id}`);
      const q = parseFloat(String(inp && inp.value || "0").replace(",",".")); if(!(q>0)) break;
      S.pantry[id] = Math.round(((S.pantry[id]||0)+q)*100)/100;
      S.bought.push({id:uid(),date:todayISO(),prod:id,qty:q}); commit(); break; }
    case "unbuy": { const b = S.bought.find(x=>x.id===el.dataset.id); if(b){ S.pantry[b.prod] = Math.max(0,Math.round(((S.pantry[b.prod]||0)-b.qty)*100)/100); S.bought = S.bought.filter(x=>x!==b); commit(); } break; }
    case "add-preset": { const p = PRESETS[+el.dataset.i]; dayLog(UI.view.date).extras.push({id:uid(),...p}); UI.view=null; commit(); window.scrollTo(0,0); break; }
    case "del-extra": { const L = dayLog(UI.date); L.extras = L.extras.filter(x=>x.id!==el.dataset.id); commit(); break; }
    case "del-w": S.weight = S.weight.filter(w=>w.d!==el.dataset.d); commit(); break;
  }
});
document.addEventListener("change", ev=>{
  const el = ev.target;
  if(el.dataset && el.dataset.act==="pantry"){
    const v = parseFloat(String(el.value).replace(",","."));
    S.pantry[el.dataset.id] = v>0 ? Math.round(v*100)/100 : 0; commit();
  }
});
document.addEventListener("submit", ev=>{
  ev.preventDefault();
  if(ev.target.id==="wf"){
    const v = parseFloat(String(document.getElementById("wkg").value).replace(",","."));
    if(!(v>=30 && v<=200)) return;
    const T = todayISO(); S.weight = S.weight.filter(w=>w.d!==T); S.weight.push({d:T,kg:Math.round(v*10)/10}); commit();
  } else if(ev.target.id==="xf"){
    const n = document.getElementById("xn").value.trim(); const num = id => Math.max(0, parseFloat(document.getElementById(id).value)||0);
    if(!n || !num("xk")) return;
    dayLog(UI.view.date).extras.push({id:uid(),n,k:num("xk"),p:num("xp"),f:num("xf2"),c:num("xc")});
    UI.view=null; commit(); window.scrollTo(0,0);
  }
});
// смена дня в полночь
let lastDay = todayISO();
setInterval(()=>{ const t=todayISO(); if(t!==lastDay){ if(UI.date===lastDay) UI.date=t; lastDay=t; if(!UI.view) render(); } }, 60000);

render();
Sync.init();
</script>
